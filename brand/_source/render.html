<!DOCTYPE html>
<!--
  Gerador do banner do perfil e das capas dos repositórios.
  Uso: render.html?id=<chave>  (ver brand/render.ps1)
  Os diagramas mostram a arquitetura real de cada projeto, descrita nos READMEs.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<style>
  :root{
    --bg:#0F1419; --surface:#151C23; --border:#2A3540; --grid:#1D2630;
    --text:#E8ECF0; --muted:#9AA7B4; --soft:#C6D0DA;
    --cyan:#5FB6C8; --petrol:#2B8A9E; --ok:#6CC79A; --wip:#E0A030;
    --sans:Inter,"Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0}
  html,body{background:transparent;overflow:hidden}
  .card{position:absolute;inset:0;border-radius:20px;background:var(--bg);border:1px solid #222C36;overflow:hidden;font-family:var(--sans);color:var(--text)}
  .card::before{content:"";position:absolute;inset:0;
    background-image:radial-gradient(var(--grid) 1.3px,transparent 1.4px);background-size:28px 28px;
    -webkit-mask-image:linear-gradient(90deg,transparent 30%,#000 62%);mask-image:linear-gradient(90deg,transparent 30%,#000 62%)}
  .bar{position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--petrol)}
  .txt{position:absolute;display:flex;flex-direction:column}
  .eyebrow{font-family:var(--mono);color:var(--muted);letter-spacing:.01em}
  .eyebrow b{color:var(--cyan);font-weight:500}
  h1{font-weight:700;letter-spacing:-.025em;line-height:1.05}
  .role{color:var(--cyan);font-weight:600;letter-spacing:-.01em}
  .desc{color:var(--muted);line-height:1.45}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{font-family:var(--mono);font-size:16px;color:var(--soft);background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:6px 12px}
  .pill{align-self:flex-start;font-family:var(--mono);font-size:15px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:6px 14px 6px 30px;position:relative;border:1px solid}
  .pill::before{content:"";position:absolute;left:13px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:currentColor}
  .pill.ok{color:var(--ok);border-color:rgba(108,199,154,.35);background:rgba(108,199,154,.08)}
  .pill.wip{color:var(--wip);border-color:rgba(224,160,48,.35);background:rgba(224,160,48,.08)}
  .pill.info{color:var(--cyan);border-color:rgba(95,182,200,.35);background:rgba(95,182,200,.08)}
  svg.dg{position:absolute;overflow:visible}
  svg text{font-family:var(--sans)}
  .n rect{fill:var(--surface);stroke:var(--border);stroke-width:1.5}
  .n.p rect{stroke:var(--petrol);stroke-width:2}
  .n.d rect{fill:transparent;stroke-dasharray:6 6}
  .n .t{fill:var(--text);font-weight:600}
  .n.d .t{fill:var(--muted)}
  .n .s{fill:var(--muted);font-family:var(--mono)}
  .e{fill:none;stroke:var(--petrol);stroke-width:2;stroke-linejoin:round}
  .e.d{stroke:#3A4C5A;stroke-dasharray:6 6}
  .dot{fill:var(--cyan)}
  .lbl{fill:var(--muted);font-family:var(--mono)!important;font-size:13px}
  .num{fill:var(--cyan);font-family:var(--mono)!important;font-size:14px}
</style>
</head>
<body>

function svgEl(tag, attrs, parent){
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, v);
  parent && parent.appendChild(el); return el;
}
function drawDiagram(items, box, card){
  const [x,y,w,h] = box;
  const svg = svgEl("svg",{class:"dg",width:w,height:h,viewBox:`0 0 ${w} ${h}`});
  svg.style.left = x+"px"; svg.style.top = y+"px";
  const dots = [];
  for (const it of items){
    if (it.k==="e"){
      svgEl("polyline",{class:"e "+it.c,points:it.pts.map(p=>p.join(",")).join(" ")},svg);
      if (!it.c) dots.push(it.pts[0], it.pts[it.pts.length-1]);
    } else if (it.k==="n"){
      const g = svgEl("g",{class:"n "+it.c},svg);
      svgEl("rect",{x:it.x,y:it.y,width:it.w,height:it.h,rx:10},g);
      const cx = it.x + 22;
      if (it.s){
        const t = svgEl("text",{class:"t",x:cx,y:it.y+it.h/2-4,"font-size":it.ts},g); t.textContent = it.t;
        const s = svgEl("text",{class:"s",x:cx,y:it.y+it.h/2+it.ss+6,"font-size":it.ss},g); s.textContent = it.s;
      } else {
        const t = svgEl("text",{class:"t",x:it.x+it.w/2,y:it.y+it.h/2+6,"font-size":it.ts>18?17:it.ts,"text-anchor":"middle"},g);
        t.textContent = it.t; t.style.fontFamily = "var(--mono)"; t.style.fontWeight = 500;
      }
    } else if (it.k==="l"){
      const t = svgEl("text",{class:it.c,x:it.x,y:it.y,"text-anchor":it.anchor},svg); t.textContent = it.t;
    }
  }
  for (const p of dots) svgEl("circle",{class:"dot",cx:p[0],cy:p[1],r:3.5},svg);
  card.appendChild(svg);
}
