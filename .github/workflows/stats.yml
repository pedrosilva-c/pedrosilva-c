# Atualiza assets/sections/analytics(-mobile).svg e o bloco em texto do README
# com dados da API do GitHub. Só faz commit quando algo mudou.
name: Estatísticas do perfil

on:
  schedule:
    - cron: "17 9 * * 1"   # segundas, 06:17 em Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar estatísticas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python brand/stats.py
      - name: Commit, se houver mudança
        run: |
          if git diff --quiet -- assets/sections/analytics.svg assets/sections/analytics-mobile.svg README.md; then
            echo "Sem mudanças."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sections/analytics.svg assets/sections/analytics-mobile.svg README.md
          git commit -m "Atualiza estatísticas do perfil"
          git push
